<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/addCourse.css">
    <style>
        #Toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 20px;
            background: #fff5f5;
            border-radius: 12px;
            border-left: 5px solid #e53e3e;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            font-size: 14px;
            font-weight: 500;
            color: #2d3748;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            z-index: 9999;
            min-width: 280px;
            max-width: 450px;
            transform: translateX(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        /* Show Toast */
        #Toast.show {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }

        /* Toast Types */
        #Toast.success {
            background: #f0fff4;
            border-left-color: #38a169;
        }

        #Toast.error {
            background: #fff5f5;
            border-left-color: #e53e3e;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="page-header">
        <h1><i class="fas fa-book"></i> My Courses</h1>
    </div>

    <!-- Add Course Form -->
    <div class="add-course-form">
        <form id="form-reset">
            <div class="form-row">
                <div class="form-group">
                    <label for="departmentSelect"><i class="fas fa-building"></i> Department</label>
                    <select id="departmentSelect">
                        <option value="" selected>Select Department</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Commerce">Commerce</option>
                        <option value="Management">Management</option>
                        <option value="Science">Science</option>
                        <option value="Arts & Humanities">Arts & Humanities</option>
                    </select>
                </div>
                <div class="form-group" id="courseDiv">
                    <label for="courseSelect"><i class="fas fa-laptop-code"></i> Course</label>
                    <select id="courseSelect">
                        <option value="" selected>Select Course</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="subjectName"><i class="fas fa-heading"></i> Subject Name</label>
                    <input type="text" id="subjectName" placeholder="e.g., Data Structures">
                </div>
                <div class="form-group">
                    <label for="courseCode"><i class="fas fa-code"></i> Course Code</label>
                    <input type="text" id="courseCode" placeholder="e.g., CS301">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="courseSemester"><i class="fas fa-calendar"></i> Semester</label>
                    <select id="courseSemester">
                        <option value="" selected>Select</option>
                        <option value="Semester I">Semester I</option>
                        <option value="Semester III">Semester III</option>
                        <option value="Semester V">Semester V</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="semesterYear"><i class="fas fa-calendar"></i> Semester Year</label>
                    <select id="semesterYear">
                        <option value="" selected>Select</option>
                        <option value="2025-26">2026-27</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="courseInstructor"><i class="fas fa-user-tie"></i> Instructor</label>
                    <input type="text" id="courseInstructor" placeholder="e.g., Dr. Smith">
                </div>
                <div class="form-group">
                    <label for="courseType"><i class="fas fa-tag"></i>Type</label>
                    <select id="courseType">
                        <option value="" selected>Select</option>
                        <option value="Theory">Theory</option>
                        <option value="Lab">Lab</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button type="reset" class="btn-reset" id="btn-Reset">Reset</button>
                <button type="button" class="btn-submit" id="btn-addCourse"><i class="fas fa-save"></i> Add Course</button>
            </div>
        </form>
    </div>
</div>
<div id="Toast"></div>
<script src="/js/addCourse.js"></script>
<script>
    department=document.getElementById("departmentSelect")
    courseDiv = document.getElementById("courseDiv");
    courseSelect = document.getElementById("courseSelect");
    const courses = {
        "Computer Science": [
            "BCA", "B.Sc Computer Science", "B.Tech CSE", "MCA", "M.Sc Computer Science"
        ],
        "Commerce": [
            "B.Com", "M.Com", "Bachelor of Economics", "B.Com Honours", "M.Com Finance"
        ],
        "Management": [
            "BBA", "BMS", "MBA", "PGDM", "BHM"
        ],
        "Science": [
            "B.Sc Physics", "B.Sc Chemistry", "B.Sc Mathematics", "B.Sc Biology", "B.Sc Biotechnology"
        ],
        "Arts & Humanities": [
            "BA English", "BA History", "BA Political Science", "BA Sociology", "BA Psychology"
        ]
    };
    department.addEventListener("change", function () {
        const selectedDepartment = this.value;
        // Clear previous courses
        courseSelect.innerHTML =
            '<option value="" selected>Select Course</option>';
        // If no department selected
        if (!selectedDepartment) {
            return;
        }
        // Get courses for selected department
        const departmentCourses = courses[selectedDepartment];
        // Add courses
        departmentCourses.forEach(function(course) {
            const option = document.createElement("option");
            option.value = course;
            option.textContent = course;
            courseSelect.appendChild(option);
        });
    });
</script>
</body>
</html>
