<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/addStudent.css">
</head>
<body>

<div class="card">
    <!-- HOME BUTTON · top right corner -->
    <a href="/Admin_Ab73Kx_AdminPanel-dF52" class="home-link">
        <i class="fas fa-home"></i>
        <span>Home</span>
    </a>

    <!-- header -->
    <div class="form-header">
        <i class="fas fa-user-graduate"></i>
        <h2>Add Student</h2>
    </div>

    <!-- form -->
    <form>
        <div class="form-grid">
            <!-- First Name -->
            <div class="field-group">
                <label for="firstName"><i class="fas fa-user"></i> First Name</label>
                <input type="text" id="firstName" placeholder="e.g. Maria">
            </div>

            <!-- Last Name -->
            <div class="field-group">
                <label for="lastName"><i class="fas fa-user"></i> Last Name</label>
                <input type="text" id="lastName" placeholder="e.g. Santos">
            </div>

            <!-- Email -->
            <div class="field-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" placeholder="student@example.com">
            </div>

            <!-- Phone -->
            <div class="field-group">
                <label for="phone"><i class="fas fa-phone-alt"></i> Phone</label>
                <input type="tel" id="phone" placeholder="+91 9678493829">
            </div>

            <!-- Age -->
            <div class="field-group">
                <label for="age"><i class="fas fa-calendar-alt"></i> Age</label>
                <input type="number" id="age" placeholder="18" min="1" max="120">
            </div>

            <!-- Gender -->
            <div class="field-group">
                <label><i class="fas fa-venus-mars"></i> Gender</label>
                <select id="genderSelect">
                    <option value="" selected>Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="field-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="*****..">
            </div>

            <div class="field-group">
                <label for="confirmpassword"><i class="fas fa-lock"></i> Confirm Password</label>
                <input type="text" id="confirmpassword">
            </div>

            <!-- Department -->
            <div class="field-group full-width">
                <label for="departmentSelect"><i class="fas fa-building"></i> Department</label>
                <select id="departmentSelect">
                    <option value="" selected>Select Department</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Commerce">Commerce</option>
                    <option value="Management">Management</option>
                    <option value="Science">Science</option>
                    <option value="Arts & Humanities">Arts & Humanities</option>
                </select>
            </div>
            <!-- Initially hidden -->
            <div class="field-group full-width" id="courseDiv" style="display: none;">
                <label for="courseSelect"><i class="fas fa-laptop-code"></i> Course</label>
                <select id="courseSelect">
                    <option value="" selected>Select Course</option>
                </select>
            </div>

            <!-- Address -->
            <div class="field-group full-width">
                <label for="address"><i class="fas fa-map-pin"></i> Address</label>
                <textarea id="address" placeholder="Street, city, postal code …" rows="2"></textarea>
            </div>
        </div>

        <!-- action buttons -->
        <div class="action-bar">
            <button type="reset" class="btn btn-reset"><i class="fas fa-undo-alt"></i> Reset</button>
            <button type="button" id="submitbtn" class="btn btn-save"><i class="fas fa-save"></i> Save</button>
        </div>
    </form>
</div>
<div id="toast"></div>
<script src="/js/addStudent.js"></script>
</body>
</html>
