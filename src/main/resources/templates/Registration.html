<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/Registration.css">
</head>
<body>
<div class="container">
    <h2>Create Account</h2>
    <p class="subtitle">Join US</p>
    <form id="Registration-form">

        <!-- Row: First & Last Name -->
        <div class="row">
            <div class="form-group">
                <label for="firstName"><i class="fas fa-user"></i>First Name</label>
                <input type="text" id="firstName" name="firstName" placeholder="First name" required>
            </div>
            <div class="form-group">
                <label for="lastName"><i class="fas fa-user"></i>Last Name</label>
                <input type="text" id="lastName" name="lastName" placeholder="Last name" required>
            </div>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email"><i class="fas fa-envelope"></i>Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <!-- Row: Password & Confirm -->
        <div class="row">
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i>Password</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmPassword"><i class="fas fa-check-circle"></i>Confirm</label>
                <div class="input-group">
                    <input type="text" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
                </div>
            </div>
        </div>

        <!-- Row: Gender & Age -->
        <div class="row">
            <div class="form-group">
                <label for="gender"><i class="fas fa-venus-mars"></i>Gender</label>
                <select id="gender" name="gender">
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="age"><i class="fas fa-calendar"></i>Age</label>
                <input type="number" id="age" name="age" placeholder="Age" min="1" max="100">
            </div>
        </div>

        <!-- Phone -->
        <div class="form-group">
            <label for="phonenumber"><i class="fas fa-phone"></i>Phone</label>
            <input type="tel" id="phonenumber" name="phonenumber" placeholder="Enter phone number">
        </div>
        <!-- Role -->
        <div class="form-group">
            <label for="role"><i class="fas fa-user-tag"></i>Role</label>
            <select id="role" name="role" required>
                <option value="">Select your role</option>
                <option value="ADMIN">Admin</option>
                <option value="STUDENT">Student</option>
            </select>
            <small>Choose your role wisely - this determines your access level</small>
        </div>
        <!-- Submit Button -->
        <button type="button" class="btn" id="CreateAccount">
            <i class="fas fa-rocket"></i> Create Account
        </button>
        <!-- Login Link -->
        <div class="login-link">
            Already have an account? <a href="/">Sign in here</a>
        </div>
    </form>
    <div id="T0ast"></div>
</div>
<script src="/js/Registration.js"></script>
</body>
</html>
